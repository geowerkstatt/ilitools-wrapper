name: Release

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      TAG_NAME:
        description: "Tag name"
        required: true

env:
  REGISTRY: ghcr.io
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAG_NAME: ${{ github.event.inputs.TAG_NAME || github.event.release.tag_name }}

jobs:
  retag-docker-image:
    runs-on: ubuntu-latest
    name: Retag Docker image as latest

    permissions:
      packages: write

    steps:
      - name: Set environment variables
        run: |
          version=${TAG_NAME#v} && major=${version%%.*}
          echo VERSION=${TAG_NAME#v} >> $GITHUB_ENV
          echo MAJOR=${major} >> $GITHUB_ENV
          echo IMAGE_NAME=$REGISTRY/$(echo ${GITHUB_REPOSITORY,,}) >> $GITHUB_ENV

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull docker image
        run: docker pull ${{ env.IMAGE_NAME }}:v${{ env.VERSION }}

      - name: Tag docker image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:v${{ env.VERSION }} ${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.IMAGE_NAME }}:v${{ env.VERSION }} ${{ env.IMAGE_NAME }}:v${{ env.MAJOR }}

      - name: Push docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:v${{ env.MAJOR }}

  publish-nuget:
    name: Publish Geowerkstatt.IlitoosWrapperApi NuGet package
    uses: ./.github/workflows/publish-nuget.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.event.inputs.TAG_NAME || github.event.release.tag_name }}
      version-tag: ${{ github.event.inputs.TAG_NAME || github.event.release.tag_name }}
    secrets: inherit
