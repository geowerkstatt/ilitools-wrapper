syntax = "proto3";

option java_multiple_files = true;
option java_package = "ch.geowerkstatt.ilitoolswrapper.proto.ilivalidator";
option java_outer_classname = "IlivalidatorProto";
option csharp_namespace = "Geowerkstatt.IlitoolsWrapperApi.Ilivalidator";

package ilitoolswrapper.ilivalidator;

import "common.proto";

service IlivalidatorService {
  rpc Validate(stream ValidateRequest) returns (stream ValidateResponse) {}
}

enum IlivalidatorFileType {
  TRANSFER_FILE_XTF = 0;
  LOG_FILE = 1;
  XTF_LOG_FILE = 2;
  REPOSITORY_ARCHIVE = 3;
  MODEL_FILE = 4;
  // The tool switches to its INTERLIS 1 semantics only for a transfer file ending in .itf,
  // so the type of the transfer file carries the format.
  TRANSFER_FILE_ITF = 5;
}

message IlivalidatorFileStart {
  IlivalidatorFileType type = 1;
}

message ValidateRequestInfo {
  bool forceTypeValidation = 1;
  bool disableAreaValidation = 2;
  bool disableConstraintValidation = 3;
  bool allObjectsAccessible = 4;
  bool multiplicityOff = 5;
  bool skipPolygonBuilding = 6;
  repeated string modelDirs = 7;
  string metaConfig = 8;
  repeated string pluginIds = 9;
  // Version of the tool to run, offered by the deployment as a directory per version. Empty selects the
  // deployment default, which is deliberately decoupled from the newest offered version. A version the
  // deployment does not offer is rejected with INVALID_ARGUMENT.
  string toolVersion = 10;
  // Extent of the validation passed as --scope, for example the BFS number of a municipality. Selects the
  // reference data refMapping names for this extent. Empty passes no scope. Supported from ilivalidator
  // 1.15.0 on; an older selected version fails in the tool.
  string scope = 11;
  // Reference data mapping in the form ilidata:<DatasetId>, resolved by the tool through the modelDirs and
  // passed as --refmapping. A field of its own because the refmapping key of a meta config has no effect when
  // the tool runs from the command line (ilivalidator 1.15.0). Empty passes no mapping.
  string refMapping = 12;
}

message ValidateRequest {
  oneof payload {
    ValidateRequestInfo info = 1;
    IlivalidatorFileStart fileStart = 2;
    bytes chunk = 3;
  }
}

message ValidateResponse {
  oneof payload {
    ilitoolswrapper.common.StatusUpdate status = 1;
    IlivalidatorFileStart fileStart = 2;
    bytes chunk = 3;
  }
}
