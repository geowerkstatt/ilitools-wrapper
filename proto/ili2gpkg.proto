syntax = "proto3";

option java_multiple_files = true;
option java_package = "ch.geowerkstatt.ilitoolswrapper.proto.ili2gpkg";
option java_outer_classname = "Ili2gpkgProto";
option csharp_namespace = "Geowerkstatt.IlitoolsWrapperApi.Ili2gpkg";

package ilitoolswrapper.ili2gpkg;

import "common.proto";

service Ili2gpkgService {
  rpc Convert(stream ConvertRequest) returns (stream ConvertResponse) {}
}

enum Ili2gpkgFileType {
  DB_FILE = 0;
  MODEL_FILE = 1;
  TRANSFER_FILE = 2;
  LOG_FILE = 3;
  XTF_LOG_FILE = 4;
  REPOSITORY_ARCHIVE = 5;
}

message Ili2gpkgFileStart {
  Ili2gpkgFileType type = 1;
}

enum ConvertOperation {
  OPERATION_SCHEMA_IMPORT = 0;
  OPERATION_IMPORT = 1;
  OPERATION_EXPORT = 2;
  OPERATION_UPDATE = 3;
  OPERATION_VALIDATE = 4;
}

enum TransferFormat {
  TRANSFER_FORMAT_XTF = 0;
  TRANSFER_FORMAT_ITF = 1;
  TRANSFER_FORMAT_GML = 2;
}

message ConvertRequestInfo {
  ConvertOperation operation = 1;
  repeated string models = 2;
  int32 defaultSrsCode = 3;
  bool disableValidation = 4;
  bool createBasketCol = 5;
  bool sqlEnableNull = 6;
  bool skipReferenceErrors = 7;
  bool skipGeometryErrors = 8;
  bool importTid = 9;
  bool strokeArcs = 10;
  string dataset = 11;
  repeated string modelDirs = 12;
  string metaConfig = 13;
  // Ids of the plugins to load, each offered by the deployment as a folder of the plugin catalog. Named
  // after what the field carries and not after the tool option: --plugins takes a single folder, which the
  // wrapper composes from this selection.
  // Empty means no plugin runs. An id the deployment does not offer is rejected with INVALID_ARGUMENT.
  repeated string pluginIds = 14;
  // Version of the tool to run, offered by the deployment as a directory per version. Empty selects the
  // deployment default, which is deliberately decoupled from the newest offered version. A version the
  // deployment does not offer is rejected with INVALID_ARGUMENT.
  string toolVersion = 15;
  bool createFk = 16;
  bool createGeomIdx = 17;
  bool createEnumTabs = 18;
  bool createTidCol = 19;
  bool beautifyEnumDispName = 20;
  bool smart1Inheritance = 21;
  bool smart2Inheritance = 22;
  bool sqlColsAsText = 23;
  bool doSchemaImport = 24;
  bool deleteData = 25;
  bool skipPolygonBuilding = 26;
  bool importBid = 27;
  repeated string topics = 28;
  repeated string baskets = 29;
  repeated string exportModels = 30;
  // The transfer format to use for the TRANSFER_FILE file type (import, update and export), defaults to XTF if not set.
  TransferFormat transferFormat = 31;
  bool disableAreaValidation = 32;
  bool forceTypeValidation = 33;
  string validConfig = 34;
}

message ConvertRequest {
  oneof payload {
    ConvertRequestInfo info = 1;
    Ili2gpkgFileStart fileStart = 2;
    bytes chunk = 3;
  }
}

message ConvertResponse {
  oneof payload {
    ilitoolswrapper.common.StatusUpdate status = 1;
    Ili2gpkgFileStart fileStart = 2;
    bytes chunk = 3;
  }
}
